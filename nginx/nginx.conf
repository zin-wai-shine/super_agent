events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # File upload size
    client_max_body_size 50M;

    # Bot detection for Open Graph routing
    map $http_user_agent $is_bot {
        default 0;
        ~*(facebookexternalhit|twitterbot|whatsapp|linkedinbot|pinterest|slackbot|telegrambot|applebot|discordbot|vkshare|skypeuripreview|facebot|bingbot|googlebot|adidxbot|duckduckbot|embedly|quora|viber|line|crawler|spider|bot|search) 1;
    }

    # Upstream definitions
    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name bolthave.com www.bolthave.com srv1534108.hstgr.cloud *.srv1534108.hstgr.cloud bolthavenproperty.com www.bolthavenproperty.com;

        # Allow ACME challenge for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name bolthave.com www.bolthave.com srv1534108.hstgr.cloud *.srv1534108.hstgr.cloud bolthavenproperty.com www.bolthavenproperty.com;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/bolthave.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bolthave.com/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Extract subdomain for tenant identification
        set $tenant "";
        if ($host ~* ^([^.]+)\.(srv1534108\.hstgr\.cloud)$) {
            set $tenant $1;
        }
        if ($host ~* ^([^.]+)\.(bolthave\.com)$) {
            set $tenant $1;
        }
        if ($host ~* ^([^.]+)\.(bolthavenproperty\.com)$) {
            set $tenant $1;
        }
        if ($host ~* ^([^.]+)\.(superrealestate\.localhost)$) {
            set $tenant $1;
        }
        if ($tenant = "www") {
            set $tenant "bolthaven";
        }
        if ($host = "bolthave.com") {
            set $tenant "bolthaven";
        }
        if ($host = "bolthavenproperty.com") {
            set $tenant "bolthaven";
        }

        # Static uploads
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API routes
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
            proxy_cache_bypass $http_upgrade;
        }

        # File upload routes
        location /api/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
        }

        # Clean sharing URLs
        location /p/ {
            rewrite ^/p/(.*)$ /api/public/share/listing/$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
        }

        # Frontend routes
        location / {
            add_header X-Is-Bot $is_bot always;
            add_header X-Tenant-Debug $tenant always;

            # Social media crawler detection
            if ($is_bot) {
                error_page 418 = @bot_proxy;
                return 418;
            }

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
            proxy_cache_bypass $http_upgrade;
        }

        # Named location for bot requests to serve metadata
        location @bot_proxy {
            # Homepage -> Agent Meta
            rewrite ^/$ /api/public/share/agent break;
            
            # Listing page -> Listing Meta
            rewrite ^/listings/([a-zA-Z0-9-]+)$ /api/public/share/listing/$1 break;
            
            # All other routes default to agent meta if shared
            # rewrite ^/.*$ /api/public/share/agent break;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
