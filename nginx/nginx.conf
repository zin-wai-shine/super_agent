events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon application/font-woff application/font-woff2 font/woff2;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # File upload size
    client_max_body_size 50M;

    # API response cache
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m;

    # Bot detection for Open Graph routing
    map $http_user_agent $is_bot {
        default 0;
        ~*(facebookexternalhit|twitterbot|whatsapp|linkedinbot|pinterest|slackbot|telegrambot|applebot|discordbot|vkshare|skypeuripreview|facebot|bingbot|googlebot|adidxbot|duckduckbot|embedly|quora|viber|line|crawler|spider|bot|search|skype|render|screenshot) 1;
    }

    # Upstream definitions
    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name bolthave.com www.bolthave.com srv1534108.hstgr.cloud *.srv1534108.hstgr.cloud bolthavenproperty.com www.bolthavenproperty.com;

        # Allow ACME challenge for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name bolthave.com www.bolthave.com srv1534108.hstgr.cloud *.srv1534108.hstgr.cloud bolthavenproperty.com www.bolthavenproperty.com;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/bolthave.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bolthave.com/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Extract subdomain for tenant identification
        set $tenant "";
        if ($host ~* ^([^.]+)\.(srv1534108\.hstgr\.cloud)$) {
            set $tenant $1;
        }
        if ($host ~* ^([^.]+)\.(bolthave\.com)$) {
            set $tenant $1;
        }
        if ($host ~* ^([^.]+)\.(bolthavenproperty\.com)$) {
            set $tenant $1;
        }
        if ($host ~* ^([^.]+)\.(superrealestate\.localhost)$) {
            set $tenant $1;
        }
        if ($tenant = "www") {
            set $tenant "bolthaven";
        }
        if ($host = "bolthave.com") {
            set $tenant "bolthaven";
        }
        if ($host = "bolthavenproperty.com") {
            set $tenant "bolthaven";
        }

        # Static uploads
        location ^~ /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API routes
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
            proxy_cache_bypass $http_upgrade;

            # Cache GET requests for public API endpoints
            proxy_cache api_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 2m;
            proxy_cache_key $scheme$host$request_uri;
            proxy_cache_bypass $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # File upload routes
        location /api/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
        }

        # Clean sharing URLs
        location /p/ {
            rewrite ^/p/(.*)$ /api/public/share/listing/$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
        }

        # Cache static frontend assets (JS, CSS, images)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Tenant $tenant;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Frontend routes
        location / {
            # Social media crawler detection
            if ($is_bot) {
                error_page 418 = @bot_proxy;
                return 418;
            }

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
            proxy_cache_bypass $http_upgrade;
        }

        # Named location for bot requests to serve metadata
        location @bot_proxy {
            # 1. Check for specific listing in query param (e.g. /?detail=...)
            if ($arg_detail) {
                rewrite ^ /api/public/share/listing/$arg_detail break;
            }

            # 2. Homepage -> Agent Meta
            rewrite ^/$ /api/public/share/agent break;
            
            # 3. Listing page -> Listing Meta
            rewrite ^/listings/([a-zA-Z0-9-]+)$ /api/public/share/listing/$1 break;
            
            # 4. Collection page -> Agent Meta (or specific collection meta if implemented)
            rewrite ^/collections/.*$ /api/public/share/agent break;

            # 5. All other routes default to agent meta if shared
            rewrite ^/.*$ /api/public/share/agent break;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant $tenant;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
