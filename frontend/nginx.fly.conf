server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Extract subdomain from $host for tenant resolution
    # e.g. staynert.haizo.it.com -> staynert
    set $tenant_subdomain "";
    if ($http_host ~* "^([^.]+)\.(haizo\.it\.com|super-agent-frontend-zin\.fly\.dev)") {
        set $tenant_subdomain $1;
    }
    # Exclude www and the root domains themselves
    if ($tenant_subdomain = "www") {
        set $tenant_subdomain "";
    }

    # Bot detection for social media crawlers
    set $bot_request 0;
    if ($http_user_agent ~* "facebookexternalhit|twitterbot|baiduspider|bingbot|googlebot|WhatsApp|TelegramBot|Slackbot|redditbot|Discordbot|iMessage|Applebot|Facebot|Embedly|LinkedInBot") {
        set $bot_request 1;
    }

    # Handle Bot Rewrites (Server Level)
    if ($bot_request = 1) {
        rewrite ^/listings/([0-9a-fA-F-]+)$ /api/public/share/listing/$1 last;
        rewrite ^/$ /api/public/share/agent last;
        rewrite ^$ /api/public/share/agent last;
    }

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        resolver 8.8.8.8;
        set $backend "https://super-agent-backend-zin.fly.dev";
        proxy_pass $backend;
        proxy_set_header Host super-agent-backend-zin.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Tenant resolution: forward extracted subdomain OR pass client X-Tenant if set
        set $x_tenant $http_x_tenant;
        if ($tenant_subdomain != "") {
            set $x_tenant $tenant_subdomain;
        }
        proxy_set_header X-Tenant $x_tenant;
    }

    # Proxy uploads to backend
    location /uploads/ {
        resolver 8.8.8.8;
        set $backend "https://super-agent-backend-zin.fly.dev";
        proxy_pass $backend;
        proxy_set_header Host super-agent-backend-zin.fly.dev;
    }

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
