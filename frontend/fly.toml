app = "super-agent-frontend-zin"
primary_region = "sin"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[build]
  [build.args]
    # Point to the backend app's public URL or internal name
    # REACT_APP_API_URL = "https://super-agent-backend-zin.fly.dev/api"
    # REACT_APP_GOOGLE_MAPS_API_KEY = "your_key"
    # REACT_APP_MAIN_DOMAIN = "super-agent-frontend-zin.fly.dev"

[env]
  PORT = "3000"
