services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: super_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: super_real_estate
      POSTGRES_USER: super_admin
      POSTGRES_PASSWORD: super_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - super_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U super_admin -d super_real_estate" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: super_backend
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=super_admin
      - DB_PASSWORD=super_secret_password
      - DB_NAME=super_real_estate
      - JWT_SECRET=super_jwt_secret_key_change_in_production
      - UPLOAD_PATH=/app/uploads
      - GIN_MODE=debug
      - MAIN_DOMAIN=superealestate.test
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - super_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
        - REACT_APP_MAIN_DOMAIN=superealestate.test
    container_name: super_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - super_network

  # Documentation App
  docs:
    build:
      context: ./docs-app
      dockerfile: Dockerfile
    container_name: super_docs
    restart: unless-stopped
    ports:
      - "3443:3443"
    networks:
      - super_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: super_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - super_network

volumes:
  postgres_data:


networks:
  super_network:
    driver: bridge
