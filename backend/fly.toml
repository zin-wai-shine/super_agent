app = "super-agent-backend-zin"
primary_region = "sin"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  GIN_MODE = "release"
  UPLOAD_PATH = "/app/uploads"
  DB_PORT = "5432"
  # MAIN_DOMAIN should be your production domain (e.g. agent.super.com or super-frontend.fly.dev)
  MAIN_DOMAIN = "haizo.it.com"

[[mounts]]
  source = "super_uploads"
  destination = "/app/uploads"

[checks]
  [checks.status]
    port = 8080
    type = "http"
    interval = "10s"
    timeout = "2s"
    method = "get"
    path = "/api/health"
